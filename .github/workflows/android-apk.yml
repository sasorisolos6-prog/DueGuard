name: Build DueGuard Web & Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  typecheck-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck API & Web
        run: npm run typecheck

      - name: Build Web & Sync Capacitor Android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
        run: npm run cap:sync

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android Debug APK
        run: |
          chmod +x apps/web/android/gradlew
          cd apps/web/android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dueguard-android-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
